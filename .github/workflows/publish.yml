name: publish

# PRs build only; main pushes ghcr.io/ddupan/arc-runner:latest. homelab-infra pins the digest (Renovate
# proposes bumps), so pushing here changes nothing until that PR merges.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ddupan/arc-runner
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --pull -t "$IMAGE:latest" .
      - name: Smoke test
        run: docker run --rm --entrypoint bash "$IMAGE:latest" -c 'node --version && npm --version && npx --version && yarn --version && python3 -m venv /tmp/v && zip -v >/dev/null && /home/runner/run.sh --version'
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:latest"
